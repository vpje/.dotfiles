background {
    monitor =
    path = ~/Pictures/wallpapers/IMG20260407132124.jpg # or use "screenshot" to use the current desktop
    color = rgba(25, 20, 20, 1.0)
    # Blur settings (raise blur_passes for a nicer look, costs a bit of GPU)
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# hyprlock has its own tiny animation config, separate from hyprland.conf
animations {
    enabled = true

    bezier = linear, 1, 1, 0, 0
    bezier = easeOutQuint, 0.23, 1, 0.32, 1

    animation = fadeIn, 1, 5, easeOutQuint
    animation = fadeOut, 1, 5, easeOutQuint
    animation = inputFieldDots, 1, 2, linear
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgb(151515)
    inner_color = rgb(200, 200, 200)
    font_color = rgb(10, 10, 10)
    fade_on_empty = false
    fade_timeout = 1000 # milliseconds before fading on empty, fade_on_empty must be true
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

# Clock label that fades in with the lock screen
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M:%S")"
    color = rgba(255, 255, 255, 0.9)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 200
    halign = center
    valign = center
}
