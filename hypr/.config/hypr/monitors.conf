# #######################################################################################
# MONITOR CONFIGURATION - all known locations kept active.
#
# Hyprland matches `monitor=desc:...` lines by the monitor's EDID description. If a
# described monitor is not physically connected, the line is simply a no-op: no error,
# nothing applied. This means we don't need any runtime location-detection script - we
# just declare every monitor from every location here, and whichever ones are actually
# plugged in at a given location/time are the ones that apply.
#
# IMPORTANT: `workspace = N, monitor:desc:...` rules do NOT behave the same way. Hyprland
# only keeps the FIRST rule it parses for a given workspace number N - if two locations
# reuse the same N for different monitors, the second (later) rule is silently dropped,
# even while its monitor is the only one connected. Verify with `hyprctl workspacerules`.
# Because of this, every monitor role below gets its OWN unique workspace ID range - IDs
# are never reused across locations. The mainMod+[1-9] keybinds (see hyprland.conf) call
# a small script (scripts/wsgo.sh) that maps the pressed key to whichever workspace ID is
# actually valid for the monitors currently connected.
#
# Find a monitor's description with: hyprctl monitors all
# See https://wiki.hyprland.org/Configuring/Monitors/
# #######################################################################################

# laptop screen 3200x2000
monitor=desc:Samsung Display Corp. ATNA60KA02-0, preferred, 0x0,2

### Home ###

# samsung monitor home 3840x2160
monitor=desc:Samsung Electric Company U32J59x HTPK701161, preferred, 1600x0,1.5

# lg monitor home 1920x1080, start x at 3200/2 + 3840/1.5 = 4160
monitor=desc:LG Electronics LG FHD 503AXFL0E323, preferred, 4160x0,1

### Work ###

# work 1 1920x1200
monitor=desc:Dell Inc. DELL U2412M 0FFXD45J3TCS, preferred, 1600x0,1

# work 2 1680x1050, start x at 3200/2 + 1920 = 3520
monitor=desc:Dell Inc. DELL 2209WA H735H9B928YL, preferred, 3520x0,1

# fallback for any unnamed/unknown monitor plugged in
monitor=,preferred,auto,1


##############################
### WORKSPACE <-> MONITOR ###
##############################
#
# Every monitor role has its own unique, never-reused workspace ID range (see note above).
# Roles sharing the same logical "slot" (1st/2nd/3rd screen of a location):
#   slot 1 -> workspaces 1  (Home 4K) / 11 (Work screen 1)
#   slot 2 -> workspaces 4  (Home LG) / 14 (Work screen 2)
#   slot 3 -> workspace  7  (Laptop, used at both locations - only one physical monitor)
# scripts/wsgo.sh resolves mainMod+[1-6] to the right ID depending on what's connected.

# Laptop (used at both locations)
workspace = 7, monitor:desc:Samsung Display Corp. ATNA60KA02-0, default:true
workspace = 8, monitor:desc:Samsung Display Corp. ATNA60KA02-0, default:false
workspace = 9, monitor:desc:Samsung Display Corp. ATNA60KA02-0, default:false

# Home 4K
workspace = 1, monitor:desc:Samsung Electric Company U32J59x HTPK701161, default:true
workspace = 2, monitor:desc:Samsung Electric Company U32J59x HTPK701161, default:false
workspace = 3, monitor:desc:Samsung Electric Company U32J59x HTPK701161, default:false

# Home LG
workspace = 4, monitor:desc:LG Electronics LG FHD 503AXFL0E323, default:true
workspace = 5, monitor:desc:LG Electronics LG FHD 503AXFL0E323, default:false
workspace = 6, monitor:desc:LG Electronics LG FHD 503AXFL0E323, default:false

# Work screen 1 (unique IDs - do NOT reuse 1/2/3, see note above)
workspace = 11, monitor:desc:Dell Inc. DELL U2412M 0FFXD45J3TCS, default:true
workspace = 12, monitor:desc:Dell Inc. DELL U2412M 0FFXD45J3TCS, default:false
workspace = 13, monitor:desc:Dell Inc. DELL U2412M 0FFXD45J3TCS, default:false

# Work screen 2 (unique IDs - do NOT reuse 4/5/6, see note above)
workspace = 14, monitor:desc:Dell Inc. DELL 2209WA H735H9B928YL, default:true
workspace = 15, monitor:desc:Dell Inc. DELL 2209WA H735H9B928YL, default:false
workspace = 16, monitor:desc:Dell Inc. DELL 2209WA H735H9B928YL, default:false
